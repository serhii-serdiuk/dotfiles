# Only the settings and keys that differ from ranger's built-in rc.conf,
# which ranger always loads first

set column_ratios 2,4,6
set vcs_aware true
set line_numbers relative

cmap <a-f> eval fm.ui.console.move_word(right=4)

map J move down=5
map K move up=5

map <A-j> scroll_preview 10
map <A-k> scroll_preview -10

map Y copy
map P paste

map gs cd /usr/share
map ga cd /usr/share/applications
map gD cd /data
map gH cd /data/home

map f  console fzf_filter%space
map T  console travel%space
map F  console flat -1
map B  console bulkrename
map D  console delete
map Cd console mkdir%space
map Cf console touch%space
